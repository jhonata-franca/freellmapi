[build]
builder = "NIXPACKS"
buildCommand = "cd /app/freellmapi/server && npm run build"

[deploy]
startCommand = "cd /app/freellmapi/server && npm start"
healthcheckPath = "/api/ping"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "3001"
HOST = "0.0.0.0"
SERVE_STATIC_ASSETS = "false"